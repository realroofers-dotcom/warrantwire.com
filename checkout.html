<!-- BUILT 2026-09-11 · warrantwire checkout-1l — Cancel where a man can see it
     Lives at warrantwire.com/checkout.html

     ⚠ THIS PAGE EXISTS BECAUSE EVERY SITE WITH MORE THAN ONE PRODUCT HAS ONE.
     The price list says what things cost. This says what YOU are buying and
     takes the money. Trying to do both on one page is what produced nine
     payment boxes on a price list and a page nobody could read.

     ⚠ ONE PRODUCT ON IT. That is the whole point. ACHplug's box is built to be
     the only thing on a page — one script tag, one box, where the tag sits —
     and on a checkout page that is exactly right rather than a limitation.
     The line goes on UNCHANGED: no CSS to shrink it, no handler to reveal it,
     nothing a seller would not paste themselves.

     ⚠ THE BUY BUTTONS STAY ON THE PRODUCTS. His ruling — a man reading about
     a company presses buy where he is standing, and this page shows him what
     he has picked before he pays for it. So a button ADDS to this page rather
     than jumping him to a card form.

     ⚠ MORE THAN ONE THING CAN BE ON IT, AND THE BOX TAKES THE TOTAL. ACHplug
     charges one amount; that amount is the sum, and the list above it says
     what the sum is made of.

     ⚠ THE PRODUCT COMES FROM THE ADDRESS. /checkout.html?buy=wire_search
     Everything about it — the name, the price, the description — is in the
     one table below, and the price shown to the buyer is the price the pay
     desk charges. If those two ever disagree it is a chargeback, so there is
     one table and nowhere else to type a number.

     ⚠ AND THE CONTEXT TRAVELS. A read is a read OF A FILING. ?ticker= and
     ?acc= come through the address and go into the order, so the ACHplug
     journal says "One warrant filing read — TOVX" rather than a row nobody
     can match to anything. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout — Warrant Wire</title>
<meta name="robots" content="noindex">
<style>
:root{
  /* ⚠ MUCH LIGHTER. A page taking somebody's bank details was reading as
     near-black with darker holes in it, which looks unfinished and makes a man
     hesitate at the worst possible moment. This is a proper grey: the page
     light, the card lighter still, the panels holding the detail sitting a
     shade below, and the fields below those. Four steps, all of them visible. */
  --paper:#3f4539; --panel:#4d5443; --line:#7d8568;
  --ink:#f7f6ee; --ink2:#d3d5c4; --ink3:#a1a690;
  --hot:#c65a4a; --warm:#c9a227; --cool:#6fa88c;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:16px/1.6 Georgia,"Iowan Old Style",serif;-webkit-font-smoothing:antialiased}
a{color:var(--cool)}
/* ⚠ EVERYTHING SITS ON ONE LIGHTER CARD. Separate panels floating on a dark
   page left the whole thing reading as a hole with boxes dropped in it. The
   card IS the page — one lighter grey field holding the header, what he is
   buying and how he pays, so the eye has an edge to work against. */
.page{max-width:600px;margin:26px auto 60px;padding:6px;
  /* ⚠ FLAT. A shadow under a light panel reads as a fade into the page, which
     is what made it look washed rather than grey. One solid colour, one
     border, nothing bleeding. */
  background:#5a6150;border:1px solid #7d8568;border-radius:10px}
.wrap{max-width:none;margin:0;padding:16px 20px 22px;
  background:var(--panel);border-radius:9px}
header.mast{display:flex;justify-content:space-between;align-items:baseline;
  gap:16px;border-bottom:1px solid var(--line);padding-bottom:12px}
.mark{font:700 21px/1 var(--sans);letter-spacing:.02em;color:var(--ink);text-decoration:none}
.mark b{color:var(--hot)}
.back{font-size:13.5px;color:var(--ink3);text-decoration:none}
.back:hover{color:var(--ink)}

/* ⚠ THE TWO STEPS ARE NUMBERED. A checkout with unlabelled sections is a
   page a man reads twice to work out where he is. */
.step{font:600 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--warm);margin:24px 0 9px;display:flex;align-items:center;gap:9px}
.step i{font-style:normal;display:inline-flex;width:19px;height:19px;
  align-items:center;justify-content:center;border-radius:50%;
  background:var(--warm);color:#1e211a;font:700 11px var(--sans)}
.once{color:var(--ink3);font-size:13px;margin:12px 0 0;
  padding-top:12px;border-top:1px solid var(--line)}

/* what you are buying */
.item{background:#434a3a;border:1px solid var(--line);border-radius:8px;
  padding:17px 20px}
.item h1{font:400 26px/1.2 Georgia,serif;margin:0}
.item .ctx{font:600 12px var(--mono);letter-spacing:.1em;color:var(--warm);
  margin:8px 0 0;text-transform:uppercase}
.item p{color:var(--ink2);margin:10px 0 0;font-size:15px}
.line{display:flex;justify-content:space-between;gap:18px;
  padding:13px 0;border-bottom:1px solid var(--line)}
.line:first-child{padding-top:0}
.line:last-of-type{border-bottom:0}
.line b{font:400 19px/1.25 Georgia,serif;color:var(--ink);display:block}
.line .ctx{display:inline-block;font:600 11px var(--mono);letter-spacing:.1em;
  color:var(--warm);margin-top:5px;text-transform:uppercase}
.line p{color:var(--ink2);margin:6px 0 0;font-size:14px}
.line .right{text-align:right;white-space:nowrap}
.line .p{font:700 17px var(--mono);color:var(--ink);display:block}
/* ⚠ REMOVE WAS A GREY UNDERLINE THAT LOOKED LIKE A FOOTNOTE. A man changing
   his mind should not have to hunt for it. */
.rm{margin-top:9px;background:transparent;border:1px solid var(--line);
  color:var(--ink2);border-radius:5px;
  font:600 12px var(--sans);cursor:pointer;padding:6px 11px}
.rm:hover{border-color:var(--hot);color:var(--hot);background:rgba(198,90,74,.08)}

/* ⚠ AND A WAY OUT OF THE WHOLE THING. Taking one line off at a time when he
   has decided against all of it is a man being made to work for the privilege
   of not buying. */
.away{display:flex;justify-content:space-between;align-items:center;
  gap:14px;flex-wrap:wrap;margin:14px 0 0}

/* ⚠ THE STEP AND THE WAY OUT ON THE SAME LINE. */
.steprow{display:flex;align-items:center;justify-content:space-between;
  gap:14px;margin:24px 0 9px}
.steprow .step{margin:0}
.cancel{background:transparent;border:1px solid var(--line);
  color:var(--ink2);border-radius:5px;cursor:pointer;
  font:600 12px var(--sans);padding:7px 14px}
.cancel:hover{border-color:var(--hot);color:var(--hot);
  background:rgba(198,90,74,.09)}
.item .amt{font:700 34px/1 var(--mono);color:var(--ink);margin:16px 0 0;
  font-variant-numeric:tabular-nums}
.item .amt small{display:block;font:400 12.5px var(--sans);color:var(--ink3);
  margin-top:6px;letter-spacing:.02em}

/* ⚠ THE PAYMENT AREA IS A PANEL NOW, NOT A HOLE. ACHplug draws its box with a
   border and no background of its own, so it sat straight on the page and the
   whole lower half read as one flat sheet. Making the page grey was not enough
   — the eye needs an edge to know where the form starts. */
.pay{margin-top:0;background:#434a3a;border:1px solid var(--line);
  border-radius:8px;padding:4px 10px 8px}

/* ============================================================
   ⚠ THE FIELDS HAD NO EDGES. ACHplug draws its inputs with a border colour
   taken from --ach-line, and on a dark page that colour disappeared — so a man
   filling in a routing number was aiming at nothing. Every box gets a visible
   edge here, and the one he is in gets a brighter one.

   ⚠ ALL OF IT IS CSS ON THIS PAGE. Not a line of the plug is touched.
   ============================================================ */
.achplug{--ach-line:#8a9270}
/* ⚠ THE TWO CHOICES NEED EDGES TOO. Card and bank sat on the same colour as
   everything around them, so there was nothing to tell a man they were two
   things to choose between. */
.achplug-opt{border:1px solid #7d8568 !important;background:#525a47 !important;
  border-radius:7px !important}
.achplug-bank{border-color:var(--cool) !important;
  background:rgba(111,168,140,.10) !important}
.achplug input,
.achplug select{
  /* ⚠ A BOX AND A HEAVIER LINE UNDER IT. A thin even border on a dark panel
     is nearly invisible — the underline is what makes a field look like
     somewhere to write rather than a shaded rectangle. */
  border:1px solid #8a9270 !important;
  border-bottom:2.5px solid #b6c092 !important;
  background:#333a2b !important;
  color:var(--ink) !important;
  border-radius:5px !important;
  padding:12px 13px !important;
  font-size:16px !important;   /* ⚠ 16px OR A PHONE ZOOMS IN ON FOCUS */
}
.achplug input::placeholder{color:#9ba284 !important}
.achplug input:focus,
.achplug select:focus{
  border-color:var(--warm) !important;
  border-bottom-color:var(--warm) !important;
  background:#353c2c !important;
  outline:2px solid rgba(201,162,39,.30) !important;
  outline-offset:1px !important;
}
/* the label above each one, so it reads as a form rather than a wall */
.achplug-field span{color:var(--ink2) !important;font-size:13px !important;
  margin-bottom:5px !important}
.achplug-slip h4{color:var(--ink) !important}

/* ⚠ THE ERROR IS MADE IMPOSSIBLE TO MISS, because the one that was there was a
   thin red line under a box he could not see. */
.achplug-err{
  border-left:3px solid #d9584a !important;
  background:rgba(217,88,74,.10) !important;
  padding:10px 12px !important;
  border-radius:4px !important;
  font-size:14px !important;
}
.miss{background:var(--panel);border-left:3px solid var(--hot);padding:18px 20px;
  color:var(--ink2)}
.miss b{color:var(--ink);font-weight:400;display:block;margin-bottom:5px}

.small{color:var(--ink3);font-size:12.5px;margin:14px 0 0;line-height:1.5}
footer{margin-top:44px;border-top:1px solid var(--line);padding-top:14px;
  color:var(--ink3);font-size:13px}
footer a{color:var(--ink2);text-decoration:none;margin-right:20px}
</style>
</head>
<body>
<div class="page">
<div class="wrap">

  <header class="mast">
    <a class="mark" href="/">WARRANT<b>WIRE</b></a>
    <a class="back" href="/prices.html">All prices</a>
  </header>

  <div id="out"></div>

  <!-- ⚠ THE VERSION, WHERE A PERSON CAN SEE IT. Twice today a change was
       uploaded and the old page was still being served, and there was no way
       to tell that apart from the change not working. Now there is. -->
  <p style="color:var(--ink3);font:11px var(--mono);margin:26px 0 0;
            letter-spacing:.08em">checkout-1l</p>

  <footer>
    <a href="/prices.html">What it costs</a>
    <a href="/terms.html">Terms</a>
    <a href="/privacy.html">Privacy</a>
    <a href="/about.html">Who runs the wire</a>
  </footer>
</div>
</div>

<script>
/* ⚠ ONE TABLE, AND THE PAY DESK IS THE OTHER HALF OF IT. Every price here has
   to match the SKU of the same name at the desk. A page that says $480 while
   the card is billed $1,800 is the one mistake on this site that costs money
   rather than credibility. */
var PRODUCTS = {
  wire_search:      { name:"One search", price:12,
    desc:"Every warrant filing on one company, back to 2021 — which filing, on what day, in what form." },
  wire_year:        { name:"The year, for a holder", price:480,
    desc:"Three hundred companies a year, forty a month. A company counts once however often you open it." },
  wire_year_pro:    { name:"The year, professional volume", price:1200,
    desc:"Three thousand companies a year, four hundred a month. For somebody covering the space rather than a portfolio." },
  daily_chart:      { name:"The Daily Chart — one day", price:5,
    desc:"Today's offerings in plain English, with the new shares as a share of the company." },
  daily_chart_year: { name:"The Daily Chart — a year", price:310,
    desc:"Every day for a year. It breaks even at sixty-two days." },
  wire_read:        { name:"One warrant filing read", price:20,
    desc:"The filing and its exhibit in plain English, with the parts that matter marked." },
  wire_opinion:     { name:"An agent's opinion", price:40,
    desc:"What one of the agents makes of the warrant, beside the read." },
  deep_dive:        { name:"One company, read deep", price:149,
    desc:"Every filing a company has made, read and set against what happened next." },
  k8_year:          { name:"Reads, a year", price:1800,
    desc:"Any filing read, all year, by 8K10Q. Capped at twenty-five a month and three hundred a year." }
};

var ACH_KEY = "fjzpem2teh";
var PAY = "https://pay.realroofers.workers.dev";

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ============================================================
   WHAT IS ON THE CHECKOUT

   ⚠ KEPT IN THE BROWSER, NOT ON A SERVER. Nobody's basket is worth a database
   row until it is paid for, and a basket held on a server is a basket that
   needs a login to find again.

   ⚠ AND IT IS READ BACK THROUGH THE PRODUCT TABLE, NEVER TRUSTED AS STORED.
   What is kept is a list of SKUs. The name and the price come from the table
   in this page every time — so a saved basket cannot carry an old price, and
   editing the stored value cannot change what anything costs.
   ============================================================ */
var BASKET = "ww.checkout";

function held(){
  try {
    var raw = localStorage.getItem(BASKET);
    var list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list.filter(function(x){ return x && PRODUCTS[x.sku]; }) : [];
  } catch (e) { return []; }
}
function keep(list){
  try { localStorage.setItem(BASKET, JSON.stringify(list)); } catch (e) {}
}

var q = new URLSearchParams(location.search);
var list = held();

/* ⚠ AN ADDRESS CARRYING A PRODUCT ADDS IT, then the address is cleaned so a
   reload or a back button cannot add the same thing twice. */
var adding = q.get("buy") || q.get("sku") || "";
if (adding && PRODUCTS[adding]) {
  var t0   = (q.get("ticker") || q.get("t") || "").toUpperCase().replace(/[^A-Z0-9.\-]/g,"");
  var acc0 = (q.get("acc") || q.get("ref") || "").replace(/[^0-9\-]/g,"");
  /* ⚠ THE SAME THING NEVER LANDS ON THIS PAGE TWICE, from whichever page it
     was pressed. The band on the front page, the search results and the price
     list all add here, and a man who presses buy in two places has not decided
     to pay twice.

     ⚠ BUT TWO DIFFERENT COMPANIES ARE TWO PURCHASES. A search is a search OF
     ONE COMPANY and a read is a read OF ONE FILING — buying TOVX and LEXX is
     genuinely two, and collapsing those would sell him one and charge him for
     one when he wanted both.

     ⚠ AND A BARE ONE UPGRADES RATHER THAN DUPLICATES. Pressing buy on the
     price list gives a search with no company attached; pressing it again on
     TOVX fills that company in instead of adding a second line. */
  var i, filled = false;
  for (i = 0; i < list.length; i++) {
    if (list[i].sku !== adding) continue;
    var hasCtx  = !!(list[i].ticker || list[i].acc);
    var wantCtx = !!(t0 || acc0);
    /* already there, same company */
    if (hasCtx && wantCtx && (list[i].ticker||"") === t0 && (list[i].acc||"") === acc0) {
      filled = true; break;
    }
    /* there with no company, and now we know which one */
    if (!hasCtx && wantCtx) { list[i].ticker = t0; list[i].acc = acc0; filled = true; break; }
    /* there already, and this press names no company */
    if (!wantCtx) { filled = true; break; }
  }
  if (!filled) list.push({ sku: adding, ticker: t0, acc: acc0 });
  keep(list);
  if (history.replaceState) history.replaceState(null, "", "/checkout.html");
}

var p = list.length === 1 ? PRODUCTS[list[0].sku] : null;

/* ⚠ AN UNKNOWN PRODUCT SAYS SO AND SENDS THEM BACK. It never guesses at one:
   charging somebody for a thing they did not choose is worse than an error. */
if (!list.length) {
  document.getElementById("out").innerHTML =
    '<p class="step">Checkout</p>' +
    '<div class="miss"><b>Nothing on it yet.</b>' +
    'Press buy on anything and it will appear here before you pay. ' +
    'Everything is on <a href="/prices.html">the price list</a>.</div>';
} else {
  /* ⚠ THE TOTAL IS ADDED UP HERE, FROM THE TABLE, EVERY TIME. */
  var total = 0, rows = "";
  list.forEach(function(x, i){
    var it  = PRODUCTS[x.sku];
    var ctx = x.ticker || x.acc || "";
    total += it.price;
    rows +=
      '<div class="line">' +
        '<div>' +
          '<b>' + esc(it.name) + '</b>' +
          (ctx ? '<span class="ctx">' + esc(ctx) + '</span>' : '') +
          '<p>' + esc(it.desc) + '</p>' +
        '</div>' +
        '<div class="right">' +
          '<span class="p">$' + it.price.toLocaleString() + '</span>' +
          '<button type="button" class="rm" data-i="' + i + '">Remove</button>' +
        '</div>' +
      '</div>';
  });

  /* ⚠ THE ORDER SAYS WHAT IT WAS FOR. One thing gets its own name; several get
     a count and the first one, because an ACHplug order carries one line and
     "3 items" on its own is a row nobody can match to anything later. */
  var first = PRODUCTS[list[0].sku];
  var firstCtx = list[0].ticker || list[0].acc || "";
  var fullName = list.length === 1
    ? first.name + (firstCtx ? " — " + firstCtx : "")
    : list.length + " items — " + first.name + (firstCtx ? " — " + firstCtx : "") + " and more";
  var fullDesc = list.map(function(x){
    var c = x.ticker || x.acc || "";
    return PRODUCTS[x.sku].name + (c ? " (" + c + ")" : ""); }).join(", ");

  /* ⚠ THE CARD LINK CARRIES EVERY SKU. One product is ?go=sku as before;
     several are a comma list, and the pay desk builds a line for each. */
  var card = PAY + "/?go=" + encodeURIComponent(list.map(function(x){ return x.sku; }).join(","))
           + (list[0].ticker ? "&ticker=" + encodeURIComponent(list[0].ticker) : "")
           + (list[0].acc    ? "&ref="    + encodeURIComponent(list[0].acc) : "")
           + "&on=wire";

  document.getElementById("out").innerHTML =
    /* ⚠ CANCEL SITS AT THE TOP, WHERE HE IS LOOKING. It was small underlined
       text at the bottom of the page, BELOW the payment form — so a man who
       had changed his mind had to scroll past the thing he no longer wanted
       to find the way out. */
    '<div class="steprow">' +
      '<p class="step"><i>1</i>' +
        (list.length === 1 ? 'What you are buying' : 'What you are buying — ' + list.length + ' things') +
      '</p>' +
      '<button type="button" class="cancel" id="clear">Cancel</button>' +
    '</div>' +
    '<div class="item">' + rows +
      /* ⚠ ONE THING DOES NOT NEED A TOTAL. The price was on the line, then
         again underneath, then twice more on the payment boxes — four times
         for a twelve dollar search. A total belongs where there is something
         to add up. */
      (list.length > 1
        ? '<p class="amt">$' + total.toLocaleString() +
            '<small>One payment for all of it. Nothing renews.</small></p>'
        : '<p class="once">One payment. Nothing renews.</p>') +
    '</div>' +
    '<p class="step"><i>2</i>How you want to pay</p>' +
    '<div class="pay" id="pay"></div>' +
    '<p class="small">Paying from your bank takes 2% off. Most bank payments ' +
      'clear straight away and a few take a day or two &mdash; either way you ' +
      'get what you bought as soon as you authorise it. ' +
      'By paying you agree to the <a href="/terms.html">terms</a>, which ' +
      'include a refund within fourteen days if you want one.</p>' +
    /* ⚠ ONE CANCEL, NOT TWO. Two buttons doing the same thing is one of them
       that somebody has to think about. */
    '<div class="away">' +
      '<a class="small" style="margin:0" href="/prices.html">Add something else</a>' +
    '</div>';

  /* ⚠ REMOVING RELOADS THE PAGE. The plug has already drawn a box for the old
     total by then, and a box showing one number beside a list showing another
     is how somebody gets charged the wrong amount. */
  document.getElementById("out").addEventListener("click", function(e){
    var t = e.target;

    /* ⚠ EMPTYING IT ASKS FIRST. One stray click should not throw away a
       hundred pounds of choices he spent ten minutes making. */
    /* ⚠ CANCELLING ASKS FIRST, AND SENDS HIM SOMEWHERE. An empty checkout page
       is a dead end; the price list is where a man who cancelled one thing
       goes to choose another. */
    if (t.id === "clear") {
      if (!confirm("Cancel this order and take everything off the checkout?")) return;
      keep([]);
      location.href = "/prices.html";
      return;
    }

    var b = t.closest && t.closest(".rm");
    if (!b) return;
    var l = held();
    l.splice(Number(b.getAttribute("data-i")), 1);
    keep(l);
    /* ⚠ RELOADED, NOT REDRAWN. The plug has already built a box for the old
       total, and a box charging one number beside a list showing another is
       how a man is charged the wrong amount. */
    location.href = "/checkout.html";
  });

  /* ⚠ THE ACHPLUG LINE, EXACTLY AS THE DASHBOARD GIVES IT. The only reason it
     is written by script rather than typed into the HTML is that this one page
     serves nine products and the price has to come from the address. The tag
     itself is untouched — same attributes, same order, nothing added. */
  var s = document.createElement("script");
  s.src = "https://achplug.com/plug.js";
  s.setAttribute("data-key",    ACH_KEY);
  /* ⚠ NO NAME AND NO DESCRIPTION ON THE BOX. What is being bought is already
     set out above it, item by item, with a price against each — the box
     printing the same words again made the page say everything twice.

     ⚠ THE NAME STILL HAS TO REACH THE ORDER THOUGH, so it goes on data-desc,
     which the box does not print as a heading. Without it the ACHplug journal
     has a row nobody can match to anything. */
  /* ⚠ THE BOX PRINTED "One search — One search". fullName and fullDesc were
     both built from the product name, so passing both put it on the page
     twice. The order needs ONE line that says what it was for. */
  s.setAttribute("data-name",   "");
  s.setAttribute("data-price",  String(total));
  s.setAttribute("data-desc",   fullDesc);
  s.setAttribute("data-card",   card);
  s.setAttribute("data-repeat", "off");
  document.getElementById("pay").appendChild(s);
}

/* ============================================================
   ⚠ AN ERROR OFF THE TOP OF THE SCREEN IS NOT AN ERROR MESSAGE. The plug puts
   its complaint next to the button at the bottom, while the field it is about
   — the name — is above the fold. So when the message appears, the first empty
   box is scrolled to and given the cursor.

   ⚠ IT WATCHES RATHER THAN HOOKS. Nothing in the plug is patched or replaced;
   this only reacts to what appears on the page, so an ACHplug update cannot
   break it and it cannot break ACHplug.
   ============================================================ */
(function(){
  function firstEmpty(box){
    var f = box.querySelectorAll("input[type=text], input:not([type]), input[type=email], input[type=tel], input[type=number]");
    for (var i = 0; i < f.length; i++) {
      if (f[i].offsetParent === null) continue;      /* hidden */
      if (!String(f[i].value || "").trim()) return f[i];
    }
    return null;
  }
  function goTo(el){
    if (!el) return;
    try { el.scrollIntoView({ behavior:"smooth", block:"center" }); } catch(e){ el.scrollIntoView(); }
    /* ⚠ THE CURSOR GOES IN IT TOO. Scrolling to a box he still has to click is
       half a fix. */
    setTimeout(function(){ try { el.focus({ preventScroll:true }); } catch(e){ el.focus(); } }, 260);
  }
  var seen = null;
  new MutationObserver(function(){
    var err = document.querySelector(".achplug-err");
    if (!err || !err.textContent.trim()) { seen = null; return; }
    /* only act when the message is new, not on every repaint */
    if (err.textContent === seen) return;
    seen = err.textContent;
    var box = document.querySelector(".achplug");
    if (box) goTo(firstEmpty(box) || err);
  }).observe(document.body, { childList:true, subtree:true, characterData:true });
})();
</script>
</body>
